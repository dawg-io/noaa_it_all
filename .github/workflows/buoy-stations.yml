name: Buoy stations

# NDBC retires and recovers buoys without notice. Check every week that each
# office's buoy still reports wave height; a failed run emails the owner.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Fixes land in the dev fork, so only it needs the alert.
    if: github.repository == 'turbo5000c/dev-noaa_it_all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Check every office's NDBC buoy
        env:
          NOAA_LIVE_TESTS: "1"
        run: python -m pytest tests/test_buoy_stations_live.py -v
