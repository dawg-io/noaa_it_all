name: Release Zip

# hacs.json sets zip_release, so HACS installs from the noaa_it_all.zip attached to each
# GitHub release, and shows that asset's download count. This attaches it when a release is
# published. Run it by hand with a tag to attach the zip to a release that lacks it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach noaa_it_all.zip to, such as v0.11.2"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the manifest version matches the tag
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/noaa_it_all/manifest.json"))["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::manifest.json is $version but the tag is $TAG"
            exit 1
          fi

      - name: Build noaa_it_all.zip
        # HACS unpacks the zip into custom_components/noaa_it_all, so the integration's files go
        # at the top of the zip, not in a folder.
        run: |
          cd custom_components/noaa_it_all
          zip -r "$GITHUB_WORKSPACE/noaa_it_all.zip" . -x '*__pycache__*' '*.pyc'
          unzip -l "$GITHUB_WORKSPACE/noaa_it_all.zip"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$GITHUB_WORKSPACE/noaa_it_all.zip" --clobber --repo "$GITHUB_REPOSITORY"
